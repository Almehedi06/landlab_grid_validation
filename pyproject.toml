[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "landlab-grid-validation"
version = "0.3.0"
description = "Compare predicted and observed landslide or mass-wasting fields on a Landlab grid."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "landlab>=2.9",
]

[project.optional-dependencies]
io = ["rasterio", "geopandas"]
plot = ["matplotlib"]
test = ["pytest", "rasterio", "geopandas", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
